<!DOCTYPE html>
<!--
════════════════════════════════════════════════════════════════════════════════
  CloudRF Live Weather API Demo
  ─────────────────────────────────────────────────────────────────────────────
  This demo was created to answer the "can you do weather?" question we get.
  Rather than present a form asking users to specify the size of a raindrop, this uses a third party weather API.
  The XWeather API describes rainfall in standard mm / hour units. These are used to determine a noise figure.
  The "noise" for the wide area is uploaded to the /noise/create API as a single request.
  This is then referenced later during the Area calculation by setting nf: database in the output options with SNR units.

  By using a noise database, planners can simulate accurate RADAR coverage using real weather.

  The demo offers two modes: One for a custom unit where an attenuation multiplier from 0.0 to 1.0 can be defined to show optimistic or conservative coverage.
  Wavelength affects behaviour so the ITU-R P.838 standard has been implemented to apply wavelength based attenuation.
  As wavelength decreases, the amount of attenuation increases which is why mmWave links are vulnerable to inclement weather.

  Notes:
  The RADAR coverage will show a hole in the middle as signals stronger than 45dB SNR are transparent.
  The default config is for a 4GHz Air Surveillance RADAR detecting a 10m2 RCS (small/medium sized aircraft).



  DEPENDENCIES (CDN)
    • Leaflet 1.9.4   — interactive map
    • Bootstrap 5.3.2 — layout & tabs
    • jQuery 3.6.3    — DOM helpers used by the DF logic
════════════════════════════════════════════════════════════════════════════════
-->

    background: #eef1f5;
    font-family: 'Segoe UI', sans-serif;

/* ── Header ── */

}

/* ── Map ── */

/* ── Calculate progress spinner (floats over the map) ── */
.calc-spinner {
    position: absolute;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    display: flex; align-items: center; gap: 7px;
    background: rgba(255,255,255,.96);
    color: #495057;
    font-size: 12px; font-weight: 600;
    padding: 6px 13px;
    border-radius: 16px;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
    pointer-events: none;
    opacity: 0;
    transition: opacity .25s ease;
}
.calc-spinner.is-visible { opacity: 1; }

/* new coverage overlay fades in over the previous one */
.area-overlay-fade { transition: opacity .6s ease; }

/* ── Status bar ── */
.status-bar {
    background: #fff;
    border-top: 1px solid #dee2e6;
    padding: 5px 14px;
    font-size: 12px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 16px;

.status-bar #statusText { font-weight: 600; flex: 1; }
.status-idle    { color: #6c757d; }
.status-running { color: var(--accent); }
.status-done    { color: #198754; }
.status-error   { color: #dc3545; }

/* ── Log / JSON tab panel ── */
.log-wrap { background: #fff; border-top: 1px solid #dee2e6; flex-shrink: 0; }
.log-wrap .nav-tabs { padding: 4px 14px 0; border-bottom: 1px solid #dee2e6; }
.log-wrap .nav-tabs .nav-link { font-size: 11px; font-weight: 600; color: #6c757d; padding: 3px 10px; border-radius: 4px 4px 0 0; }
.log-wrap .nav-tabs .nav-link.active { color: #0d6efd; background: #fff; }
.log-pane {

#paneRequest  { color: #93c5fd; }
#paneResponse { color: #fde68a; }

.spin {

@keyframes rotate { to { transform: rotate(360deg); } }

.leaflet-layer,

}

</style>

/* ════════════════════════════════════════════════════════════════════════════

════════════════════════════════════════════════════════════════════════════ */

function saveApiSettings() {
    const newUrl = document.getElementById('settingsApiUrl').value.trim().replace(/\/$/, '');
    const newKey = document.getElementById('settingsApiKey').value.trim();
    const newXweatherKey = document.getElementById('settingsXweatherApiKey').value.trim();
    if (newUrl) { API_URL = newUrl; localStorage.setItem('df_api_url', newUrl); }
    if (newKey) { API_KEY = newKey; localStorage.setItem('df_api_key', newKey); }
    if (newXweatherKey) { XWEATHER_API_KEY = newXweatherKey; localStorage.setItem('df_xweather_api_key', newXweatherKey); radarLayer.setUrl(`https://maps.api.xweather.com/${XWEATHER_API_KEY}/radar/{z}/{x}/{y}/current.png`); }

    log(`Settings saved — URL: ${API_URL}`);
}

});

/* ════════════════════════════════════════════════════════════════════════════
   CONVERSION
   ════════════════════════════════════════════════════════════════════════════ */
const PALETTE = [
  { dbz: 15, rgb: [127,211, 78] }, { dbz: 20, rgb: [ 79,168, 46] },
  { dbz: 25, rgb: [ 46,125, 30] }, { dbz: 30, rgb: [ 27, 94, 20] },
  { dbz: 35, rgb: [142,142, 34] }, { dbz: 40, rgb: [201,176, 42] },
  { dbz: 45, rgb: [240,200,  8] }, { dbz: 50, rgb: [240,140,  0] },
  { dbz: 55, rgb: [224, 32, 32] }, { dbz: 60, rgb: [168, 16, 16] },
];


let hit = 0, miss = 0;
const lut = new Map();

function toDbz(r, g, b, a) {
  if (r == 0 && a == 0) return null;                    // transparent = no echo
  const k = (r << 16) | (g << 8) | b;
  if (lut.has(k)) return lut.get(k);
  let best = null, bd = Infinity;
  for (const e of PALETTE) {
    const d = (r-e.rgb[0])**2 + (g-e.rgb[1])**2 + (b-e.rgb[2])**2;
    if (d < bd) { bd = d; best = e; }
  }
  const v = bd > 3600 ? null : best.dbz;      // too far = antialiased edge
  lut.set(k, v);
  return v;
}

function dbzTodBNoise(dbz) {
    // attenuation (0-1) scales how much of the rain echo lifts the noise floor;
    // 0 → uniform -115, 1 → full -115 + dbz
    if (dbz == null) return -115;
    return -115 + dbz * attenuation
}

function pixelLatLng(w, h, bounds, x, y) {
    return L.latLng(
        bounds.getNorth() + (bounds.getSouth() - bounds.getNorth()) * (y + 0.5) / h,
        bounds.getWest()  + (bounds.getEast()  - bounds.getWest())  * (x + 0.5) / w
    );
}

async function clearExistingNoise() {
    if (!API_KEY) {
        setStatus('API key not configured — click ⚙ Settings in the toolbar to enter your CloudRF API key.', 'error');
        return;
    }

    let req = { group_name: "rain-", partial: true };
    const reqJson = JSON.stringify(req, null, 4);

    document.getElementById('paneRequest').textContent  = `POST /noise/clear\n\n${reqJson}`;
    setStatusHTML('<span class="spin"></span> Clearing noise from CloudRF API…', 'running');

        const resp    = await fetch(`${API_URL}/noise/clear`, {

        document.getElementById('paneResponse').textContent = JSON.stringify(rj, null, 4);

    } catch (e) {

}

async function uploadWeather() {
    if (!API_KEY) {
        setStatus('API key not configured — click ⚙ Settings in the toolbar to enter your CloudRF API key.', 'error');
        return;
    }

    const latLng = transmitter.getLatLng();
    const R = NOISE_TEMPLATE.output.rad * 1000;

    const all = [...DBZS_BY_TILE.values()].flat()
        .filter(d => latLng.distanceTo([d.lat, d.lon]) <= R)
        .map(d => ({ ...NOISE_PUSH_TEMPLATE, noise: dbzTodBNoise(d.dbz), latitude: d.lat, longitude: d.lon }));

    if (all.length == 0) return;

    document.getElementById('paneRequest').textContent =
        `POST /noise/create  (${all.length} entries)\n\n`
        + JSON.stringify(all.slice(0, 5), null, 4) + '\n…';
    setStatusHTML('<span class="spin"></span> Uploading noise to CloudRF API…', 'running');

    try {
        const resp = await fetch(`${API_URL}/noise/create`, {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'key': API_KEY },
            body: JSON.stringify(all)
        });
        const rj = await resp.json();
        document.getElementById('paneResponse').textContent = JSON.stringify(rj, null, 4);
        if (!resp.ok) throw new Error(JSON.stringify(rj));
        log(`Uploaded ${all.length} points`);
    } catch (e) {
        setStatus(`Network error: ${e.message}`, 'error');
        log(`Error: ${e.message}`);
    }
}

async function runAreaCalc() {
    if (!API_KEY) {
        setStatus('API key not configured — click ⚙ Settings in the toolbar to enter your CloudRF API key.', 'error');
        return;
    }

    const latLng = transmitter.getLatLng();
    const req    = { ...NOISE_TEMPLATE, transmitter: { ...NOISE_TEMPLATE.transmitter, lat: latLng.lat, lon: latLng.lng }, output: { ...NOISE_TEMPLATE.output } };
    const reqJson = JSON.stringify(req, null, 4);

    document.getElementById('paneRequest').textContent  = `POST /area\n\n${reqJson}`;
    setStatusHTML('<span class="spin"></span> Requesting coverage with rain noise from CloudRF API…', 'running');
    log(`Area request: transmitter at (${latLng.lat.toFixed(4)}, ${latLng.lng.toFixed(4)})`);

    const t0 = Date.now();
    try {
        const resp    = await fetch(`${API_URL}/area`, {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'key': API_KEY }, body: reqJson
        });
        const rj = await resp.json();
        document.getElementById('paneResponse').textContent = JSON.stringify(rj, null, 4);
        const elapsed = ((Date.now() - t0) / 1000).toFixed(1);

        if (!rj.PNG_Mercator) {
            setStatus(`API error: ${rj?.error || rj?.message || 'unknown'}`, 'error');
            log(`Error: ${JSON.stringify(rj)}`); return;
        }
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = rj.PNG_WGS84; });

        areaCanvas.width  = img.width;
        areaCanvas.height = img.height;
        areaCanvas.getContext('2d').drawImage(img, 0, 0);
        areaBounds = L.latLngBounds(
            L.latLng(rj.bounds[2], rj.bounds[3]),
            L.latLng(rj.bounds[0], rj.bounds[1])
        );
        log(`Coverage map loaded in ${elapsed}s..`);
        setBadge(`Area in ${elapsed}s`);
        setStatus('Coverage map ready.', 'done');
        return true;
    } catch (e) {
        setStatus(`Network error: ${e.message}`, 'error');
        log(`Error: ${e.message}`);
    }
}

function getColor(db) {
    if (db < 0) return null
    const dbRound = Math.round(db / 3) * 3;
    const val = SNR_DB_KEY[dbRound];
    if (val == undefined) return null;
    return val;
}

function applyAttenuation(spokes, colorKey) {
    const CELL = 0.005;
    const key = (lat, lon) => `${Math.round(lat / CELL)},${Math.round(lon / CELL)}`;

    const att = new Map();
    for (const s of spokes) {
        const k = key(s.lat, s.lon);
        const cur = att.get(k);
        if (cur === undefined || s.atten > cur) att.set(k, s.atten);
    }

    const ctx = areaCanvas.getContext('2d', { willReadFrequently: true });
    const id = ctx.getImageData(0, 0, areaCanvas.width, areaCanvas.height);
    const d = id.data;

    const W = areaCanvas.width, H = areaCanvas.height;
    const n = areaBounds.getNorth(), s = areaBounds.getSouth();
    const w = areaBounds.getWest(),  e = areaBounds.getEast();
    const dLatPx = (s - n) / H, dLonPx = (e - w) / W;
    const INV = 1 / CELL;

    for (let y = 0; y < H; y++) {
        const lat = n + dLatPx * (y + 0.5);
        const latKey = Math.round(lat * INV);
        for (let x = 0; x < W; x++) {
            const i = (y * W + x) * 4;
            if (d[i + 3] === 0) continue;
            const lon = w + dLonPx * (x + 0.5);
            const a = att.get(latKey + ',' + Math.round(lon * INV)) ?? 0;
            const v = Math.min(255, d[i] - a);

            // Apply color
            const col = getColor(v, colorKey)
            if (col == null) d[i + 3] = 0;
            else [d[i], d[i + 1], d[i + 2]] = col;
        }
    }
    ctx.putImageData(id, 0, 0);

    // Cross-fade: drop the new overlay in transparent on top of the old one,
    // fade it up, then remove the old layer once the transition has run.
    const prev = areaOverlay;
    const next = L.imageOverlay(areaCanvas.toDataURL(), areaBounds, {
        opacity: 0, className: 'area-overlay-fade'
    }).addTo(map);
    areaOverlay = next;

    requestAnimationFrame(() => requestAnimationFrame(() => {
        next.setOpacity(0.8);
        setTimeout(() => { if (prev) map.removeLayer(prev); }, 650);
    }));
}

function generateSpokes(tx) {

    setStatusHTML('<span class="spin"></span> Applying attenuation…', 'running');
    const CELL = 0.03;                       // ~3 km grid
    const key = (lat, lon) => `${Math.round(lat / CELL)},${Math.round(lon / CELL)}`;

    const alpha = new Map();
    for (const d of [...DBZS_BY_TILE.values()].flat()) {
        if (d.dbz == null) continue;
        const mmph = Math.pow((10 ** (d.dbz / 10)) / 200, 5/8);

        console.log(ATT_TYPE);

        if (ATT_TYPE == "p838") {
            const [k, a] = P838[NOISE_TEMPLATE.transmitter.frq / 1000]
            alpha.set(key(d.lat, d.lon), k * Math.pow(mmph, a))
        } else {
            // Custom manual knob: slider (0-10) scales specific attenuation
            alpha.set(key(d.lat, d.lon), (mmph / 10) * attenuation);   // dB/km
        } 
    }

    const stepKm = 0.1;
    const rot = 720
    const mPerLat = 111320, mPerLon = 111320 * Math.cos(tx.lat * Math.PI / 180);
    const out = [];

    for (let a = 0; a < rot; a++) {
        const brg = a * 2 * Math.PI / rot;
        const dLat = Math.cos(brg) / mPerLat, dLon = Math.sin(brg) / mPerLon;

        let sum = 0;
        for (let d = 0; d < NOISE_TEMPLATE.output.rad; d += stepKm) {
            const lat = tx.lat + d * 1000 * dLat, lon = tx.lng + d * 1000 * dLon;
            sum += (alpha.get(key(lat, lon)) ?? 0) * stepKm;
            out.push({ lat, lon, atten: sum });
        }
    }

    return out;
}

function handleTile(data, x, y, z) {
  const rows = [], step =100;
  for (let py = 0; py < 256; py += step) {
    for (let px = 0; px < 256; px += step) {
      const i = (py * 256 + px) * 4;
      const ll = map.unproject(L.point(x * 256 + px, y * 256 + py), z);
      rows.push({ dbz: toDbz(data[i], data[i+1], data[i+2], data[i+3]),
                  lat: ll.lat, lon: ll.lng });
    }
  }
  DBZS_BY_TILE.set(`${z}/${x}/${y}`, rows);
}

function onTileLoad(e) {
    let { x, y, z } = e.coords;

    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(e.tile, 0, 0)
    const data = ctx.getImageData(0, 0, 256, 256).data

    handleTile(data, x, y, z)
}

async function uploadAndRunAreaCalc() {
    // Keep the existing coverage layer on screen; just show a spinner while we work.
    showCalcSpinner(true);
    try {
        await clearExistingNoise();
        await uploadWeather();
        const ok = await runAreaCalc();

            const spokes = generateSpokes(transmitter.getLatLng());
            applyAttenuation(spokes);   // swaps in the new layer with a cross-fade
            setStatus("Complete", "done");
        }
    } finally {
        showCalcSpinner(false);
    }
}
