<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280">

  <!-- tail -->
  <path d="M145,190 C172,182 202,196 222,232" fill="none" stroke="#5a3115" stroke-width="32" stroke-linecap="round"/>
  <path d="M145,190 C172,182 202,196 222,232" fill="none" stroke="#d9824a" stroke-width="25" stroke-linecap="round"/>
  <path d="M178,205 C198,212 214,222 222,232" fill="none" stroke="#d9824a" stroke-width="16" stroke-linecap="round"/>

  <!-- back leg + foot -->
  <ellipse cx="100" cy="208" rx="30" ry="45" fill="#c9723c"/>
  <ellipse cx="90" cy="253" rx="34" ry="13" fill="#c9723c" stroke="#5a3115" stroke-width="4"/>

  <!-- front leg + foot -->
  <ellipse cx="140" cy="206" rx="32" ry="47" fill="#d9824a"/>
  <ellipse cx="140" cy="251" rx="36" ry="14" fill="#d9824a" stroke="#5a3115" stroke-width="4"/>

  <!-- body -->
  <ellipse cx="122" cy="155" rx="52" ry="62" fill="#e3945c" stroke="#5a3115" stroke-width="4"/>

  <!-- belly patch + pouch line -->
  <ellipse cx="124" cy="168" rx="30" ry="38" fill="#f5c99b"/>
  <path d="M100,178 Q124,192 148,178" fill="none" stroke="#c9723c" stroke-width="3" stroke-linecap="round"/>

  <!-- left arm (hanging) -->
  <ellipse cx="78" cy="168" rx="14" ry="27" fill="#e3945c" stroke="#5a3115" stroke-width="4" transform="rotate(-12 78 168)"/>

  <!-- right arm (raised, outline then fill) -->
  <path d="M168,150 C182,138 190,118 198,95" fill="none" stroke="#5a3115" stroke-width="30" stroke-linecap="round"/>
  <path d="M168,150 C182,138 190,118 198,95" fill="none" stroke="#e3945c" stroke-width="23" stroke-linecap="round"/>

  <!-- head -->
  <circle cx="128" cy="85" r="40" fill="#e3945c" stroke="#5a3115" stroke-width="4"/>

  <!-- ears -->
  <path d="M108,58 C98,35 95,15 90,8 C84,15 88,42 102,62 Z" fill="#e3945c" stroke="#5a3115" stroke-width="4" stroke-linejoin="round"/>
  <path d="M112,52 C105,35 103,20 99,14" fill="none" stroke="#f5c99b" stroke-width="5" stroke-linecap="round"/>
  <path d="M148,58 C158,35 161,15 166,8 C172,15 168,42 154,62 Z" fill="#e3945c" stroke="#5a3115" stroke-width="4" stroke-linejoin="round"/>
  <path d="M144,52 C151,35 153,20 157,14" fill="none" stroke="#f5c99b" stroke-width="5" stroke-linecap="round"/>

  <!-- muzzle -->
  <ellipse cx="128" cy="101" rx="23" ry="17" fill="#f5c99b"/>

  <!-- cheeks -->
  <circle cx="98" cy="98" r="9" fill="#f4a58a" opacity="0.6"/>
  <circle cx="158" cy="98" r="9" fill="#f4a58a" opacity="0.6"/>

  <!-- eyes -->
  <circle cx="111" cy="80" r="10" fill="#ffffff" stroke="#5a3115" stroke-width="3"/>
  <circle cx="145" cy="80" r="10" fill="#ffffff" stroke="#5a3115" stroke-width="3"/>
  <circle cx="111" cy="79" r="5" fill="#2b1810"/>
  <circle cx="145" cy="79" r="5" fill="#2b1810"/>
  <circle cx="108.5" cy="76.5" r="1.8" fill="#ffffff"/>
  <circle cx="142.5" cy="76.5" r="1.8" fill="#ffffff"/>

  <!-- nose + mouth -->
  <ellipse cx="128" cy="94" rx="5" ry="3.5" fill="#3a241a"/>
  <path d="M117,103 Q128,113 139,103" fill="none" stroke="#5a3115" stroke-width="3" stroke-linecap="round"/>

  <!-- hand paw -->
  <circle cx="198" cy="93" r="13" fill="#e3945c" stroke="#5a3115" stroke-width="4"/>

  <!-- radio -->
  <rect x="187" y="60" width="26" height="40" rx="7" fill="#455a64" stroke="#22292c" stroke-width="3"/>
  <rect x="191" y="66" width="18" height="11" rx="3" fill="#b0d8d2"/>
  <circle cx="196" cy="88" r="3.2" fill="#e5484d"/>
  <circle cx="204" cy="88" r="3.2" fill="#f2b705"/>
  <line x1="204" y1="60" x2="216" y2="32" stroke="#22292c" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="216" cy="32" r="3.5" fill="#22292c"/>
  <path d="M222,26 Q231,30 227,40" fill="none" stroke="#e3945c" stroke-width="3" stroke-linecap="round"/>
  <path d="M228,18 Q242,25 236,42" fill="none" stroke="#e3945c" stroke-width="3" stroke-linecap="round"/>
</svg>
